<!-- Deliberately standalone: Django renders this with no context at all
     (no request, no user), so it cannot extend base.html or rely on any
     context processor. Keep it self-contained. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something went wrong · Freightline</title>
  <style>
    html { min-height: 100%; background: #f8fafc; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      background: #f8fafc;
      color: #1e293b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      max-width: 420px;
      padding: 40px 32px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.06);
      text-align: center;
    }
    .code { font-size: 2.4rem; font-weight: 800; color: #0f172a; letter-spacing: -0.03em; }
    h1 { margin: 8px 0 10px; font-size: 1.3rem; color: #0f172a; }
    p { margin: 0 0 22px; color: #64748b; font-size: 0.92rem; line-height: 1.55; }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">500</div>
    <h1>Something went wrong</h1>
    <p>We hit an unexpected error on our end. It's been logged — please try again in a moment.</p>
    <a href="/">Back to Freightline</a>
  </div>
</body>
</html>
