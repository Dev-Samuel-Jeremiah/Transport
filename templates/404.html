{% extends "base.html" %}
{% block title %}Page not found · Freightline{% endblock %}
{% block content %}
<div class="empty-state" style="padding:80px 24px; text-align:center;">
  <div style="font-size:2.4rem; font-weight:800; color:var(--slate-950); letter-spacing:-0.03em;">404</div>
  <h1 class="page-title" style="margin-top:8px; font-size:1.5rem;">Page not found</h1>
  <p class="page-subtitle" style="margin:10px auto 22px; max-width:420px;">
    The page you're looking for doesn't exist, or you don't have a link to it anymore.
  </p>
  <a href="{% url 'dashboard:redirect' %}" class="btn btn-accent">Go to dashboard</a>
</div>
{% endblock %}
